# Локальный стенд. `docker compose up -d` — только сервисы (postgres, mailpit), приложение на хосте: npm run dev.
# Приложение в контейнере — профиль app (`make local-up`): вход http://zevs.test через общий nginx-local
# (апстрим — порт стенда на хосте, host.docker.internal:43128) или напрямую http://localhost:43128.
name: zevs

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zevs
      POSTGRES_PASSWORD: zevs
      POSTGRES_DB: zevs
    ports:
      - '127.0.0.1:5442:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zevs -d zevs']
      interval: 5s
      timeout: 5s
      retries: 10

  # Ловушка писем: UI http://localhost:43126. Для приложения на хосте — SMTP_HOST=localhost, SMTP_PORT=43125 в .env
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-43126}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-43125}:1025'

  app:
    profiles: [app]
    build:
      context: .
      target: dev
    container_name: zevs-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://zevs:zevs@postgres:5432/zevs
      # пусто — адреса относительные: стенд открывается и как zevs.test, и как localhost:43128
      NEXT_PUBLIC_SERVER_URL: ''
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    # зависимости ставятся в том при первом старте и после смены package-lock.json (образ пересобирать не нужно)
    command:
      - sh
      - -c
      - >-
        cmp -s package-lock.json node_modules/.lock-stamp
        || { npm ci --no-audit --no-fund && cp package-lock.json node_modules/.lock-stamp; }
        && exec npm run dev
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    ports:
      - '127.0.0.1:${APP_PORT:-43128}:43127'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:43127/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  pgdata:
  app_node_modules:
  app_next:
